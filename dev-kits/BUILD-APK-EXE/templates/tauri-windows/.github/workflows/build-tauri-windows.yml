name: "BUILD | Windows (Tauri + pnpm)"
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Installer pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - name: Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Verifier le projet
        shell: pwsh
        run: |
          if (-not (Test-Path "src-tauri/tauri.conf.json")) {
            throw "Configuration Tauri absente : ce workflow attend un projet Tauri deja initialise."
          }
          if (-not (Test-Path "pnpm-lock.yaml")) {
            throw "pnpm-lock.yaml absent. Installer et verrouiller les dependances avant compilation."
          }
      - name: Installer les dependances
        run: pnpm install --frozen-lockfile
      - name: Compiler la distribution Windows
        run: pnpm exec tauri build
      - name: Publier installateur Windows
        uses: actions/upload-artifact@v4
        with:
          name: Tauri-Windows-EXE-ou-MSI
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.zip
          if-no-files-found: error
          retention-days: 30
