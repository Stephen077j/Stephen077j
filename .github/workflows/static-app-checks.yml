name: Static app checks
on:
  push:
    branches: [main]
    paths:
      - 'projects/taskflow-lite/**'
      - 'projects/reposcope/**'
      - 'tests/**'
      - '.github/workflows/static-app-checks.yml'
  pull_request:
    paths:
      - 'projects/taskflow-lite/**'
      - 'projects/reposcope/**'
      - 'tests/**'
      - '.github/workflows/static-app-checks.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run dependency-free smoke tests
        run: node --test tests/static-apps.test.cjs
