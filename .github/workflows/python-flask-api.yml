name: Python Flask quote API checks
on:
  push:
    branches: [main]
    paths:
      - 'projects/python-flask-quote-api/**'
      - '.github/workflows/python-flask-api.yml'
  pull_request:
    paths:
      - 'projects/python-flask-quote-api/**'
      - '.github/workflows/python-flask-api.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: projects/python-flask-quote-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Flask
        run: python -m pip install -r requirements.txt
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Verify health endpoint
        run: python -c "from app import app; assert app.test_client().get('/health').get_json() == {'status':'ok'}"
