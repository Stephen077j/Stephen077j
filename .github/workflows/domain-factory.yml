name: Domain factory checks
on:
  pull_request:
    paths:
      - 'developer-toolbox/domain-factory/**'
      - '.github/workflows/domain-factory.yml'
  push:
    branches: [main]
    paths:
      - 'developer-toolbox/domain-factory/**'
      - '.github/workflows/domain-factory.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m py_compile developer-toolbox/domain-factory/create_repos.py
      - run: python developer-toolbox/domain-factory/create_repos.py --limit 100
      - run: python developer-toolbox/domain-factory/create_repos.py --only DevCore-Bible-Hymns
