name: World data registry tests
on:
  pull_request:
    paths:
      - 'developer-toolbox/data-api/**'
      - '.github/workflows/world-data-registry.yml'
  push:
    branches: [main]
    paths:
      - 'developer-toolbox/data-api/**'
      - '.github/workflows/world-data-registry.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s developer-toolbox/data-api/tests -v
