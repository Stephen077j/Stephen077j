<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101827"><title>TaskFlow Lite — Offline Task Board</title>
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#e9edf5;background:#0b1220;font-synthesis:none}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 90% 0%,#20345b 0,transparent 45%),#0b1220}main{max-width:760px;margin:0 auto;padding:52px 20px}h1{font-size:clamp(2rem,6vw,3rem);margin:0}p{color:#aabbd2}header{margin-bottom:32px}.eyebrow{font-size:.8rem;letter-spacing:.18em;text-transform:uppercase;color:#8db6ff}.panel{padding:24px;border:1px solid #344158;border-radius:18px;background:#121d30;box-shadow:0 18px 55px #0004}form{display:flex;gap:10px}input{flex:1;min-width:0;padding:14px;border:1px solid #51617d;border-radius:10px;background:#0b1424;color:#fff;font:inherit}button{border:1px solid #566780;border-radius:10px;padding:11px 15px;background:#24334b;color:white;font:inherit;cursor:pointer}button.primary{background:#75a8fb;color:#0b1528;border-color:#75a8fb;font-weight:700}button:hover{filter:brightness(1.15)}button:focus-visible,input:focus-visible{outline:3px solid #f3c87d;outline-offset:2px}.toolbar{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;margin:22px 0 12px;align-items:center}.filters{display:flex;gap:6px;flex-wrap:wrap}.filters button[aria-pressed=true]{background:#75a8fb;color:#0b1528}ul{list-style:none;margin:0;padding:0}li{display:flex;gap:12px;align-items:center;justify-content:space-between;border-top:1px solid #344158;padding:13px 0;min-width:0}.task{display:flex;align-items:center;gap:10px;min-width:0;overflow-wrap:anywhere}.task input{flex:none;width:18px;height:18px;accent-color:#75a8fb}.done{text-decoration:line-through;color:#aabbd2}.delete{color:#ffd6c9}.muted{font-size:.9rem;color:#b8c7da}.empty{padding:30px 0;text-align:center}.foot{margin-top:22px;color:#9dafc8;font-size:.85rem}@media(max-width:480px){form{flex-direction:column}.panel{padding:16px}}
</style></head><body>
<main><header><div class="eyebrow">Joel Stephen · Open-source demo</div><h1>TaskFlow <span style="color:#87b5ff">Lite</span></h1><p>A small, private-by-default task board. No account, no server, no trackers.</p></header>
<section class="panel" aria-label="Task board"><form id="new-task"><label for="title" class="muted" style="position:absolute;left:-10000px">New task</label><input id="title" maxlength="120" placeholder="What needs to get done?" autocomplete="off" required><button class="primary" type="submit">Add task</button></form>
<div class="toolbar"><span class="muted" id="count" aria-live="polite"></span><div class="filters" aria-label="Filter tasks"><button type="button" data-filter="all" aria-pressed="true">All</button><button type="button" data-filter="active" aria-pressed="false">Active</button><button type="button" data-filter="done" aria-pressed="false">Done</button></div></div>
<ul id="tasks" aria-label="Tasks"></ul><p id="empty" class="empty muted" hidden>No tasks in this view.</p></section>
<p class="foot" id="storage">Tasks are saved only in this browser.</p></main>
<script>
(()=>{'use strict';const key='taskflow-lite-v1';const input=document.querySelector('#title');const form=document.querySelector('#new-task');const list=document.querySelector('#tasks');const count=document.querySelector('#count');const empty=document.querySelector('#empty');const storage=document.querySelector('#storage');let filter='all';let tasks=[];
try{const parsed=JSON.parse(localStorage.getItem(key)||'[]');if(Array.isArray(parsed))tasks=parsed.filter(x=>x&&typeof x.id==='string'&&typeof x.title==='string'&&typeof x.done==='boolean').slice(0,500)}catch{storage.textContent='Storage unavailable or unreadable; tasks will last only until this page closes.'}
function save(){try{localStorage.setItem(key,JSON.stringify(tasks))}catch{storage.textContent='Storage is blocked or full; tasks may be lost when this page closes.'}}
function render(){list.replaceChildren();const visible=tasks.filter(x=>filter==='all'||(filter==='done'?x.done:!x.done));count.textContent=tasks.filter(x=>x.done).length+' of '+tasks.length+' completed';empty.hidden=visible.length!==0;
for(const item of visible){const li=document.createElement('li');const label=document.createElement('label');label.className='task';const tick=document.createElement('input');tick.type='checkbox';tick.checked=item.done;tick.setAttribute('aria-label','Mark '+item.title+' as '+(item.done?'active':'complete'));tick.addEventListener('change',()=>{item.done=tick.checked;save();render()});const title=document.createElement('span');title.textContent=item.title;if(item.done)title.className='done';label.append(tick,title);const del=document.createElement('button');del.type='button';del.className='delete';del.textContent='Delete';del.setAttribute('aria-label','Delete '+item.title);del.addEventListener('click',()=>{tasks=tasks.filter(x=>x.id!==item.id);save();render()});li.append(label,del);list.append(li)}}
form.addEventListener('submit',e=>{e.preventDefault();const title=input.value.trim();if(!title)return;tasks.unshift({id:typeof crypto!=='undefined'&&crypto.randomUUID?crypto.randomUUID():String(Date.now())+'-'+Math.random().toString(36).slice(2),title,done:false});input.value='';save();render();input.focus()});
document.querySelectorAll('[data-filter]').forEach(b=>b.addEventListener('click',()=>{filter=b.dataset.filter;document.querySelectorAll('[data-filter]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));render()}));render()})();
</script></body></html>
